<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do</title>
    <link rel="stylesheet" href="toDo.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    
    
        <div class="flex justify-center items-center gap-5 flex-col">
            <form id="todo_form" class="flex flex-col">
            <div class="flex flex-col gap-5 mt-10">
            <label for="task">Enter your Task</label>
            <input type="text" id="task" placeholder="Eg: Read Newspaper" class="p-4 w-100 border border-green-500" >
            <span id="count"></span>
            </div>
            <button type="submit" class="border bg-green-300 p-3 w-100 mt-5 hover:bg-white hover:text-green-500">Add to To Do </button>
            </form>
        
        <div>
            <ul id="list"></ul>
        </div>
        









        </div>








































    <script src="toDo.js"></script>
</body>
</html>
